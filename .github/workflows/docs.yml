name: DocHTML -- Build

# Builds GALE's Sphinx pages (Docs/sphinx_doc) with warnings as errors on every PR, and publishes
# them to GitHub Pages (https://erf-model.github.io/GALE/) on every push to development.

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-docs
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Docs/sphinx_doc/requirements.txt

      - name: Build Docs
        run: |
          sphinx-build -W --keep-going -b html Docs/sphinx_doc Docs/sphinx_doc/_build/html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Docs/sphinx_doc/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
